<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#f6f7f9;font-family:system-ui,"Microsoft YaHei",sans-serif}
  .wrap{padding:28px;display:flex;gap:24px}
  .card{background:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .card img{width:192px;height:192px;display:block}
  .row{display:flex;gap:10px;align-items:flex-end}
  .row img{width:44px;height:44px}
  .row img.small{width:24px;height:24px}
  .name{font-size:13px;color:#475467}
  .dark{background:#0b1220}
  .dark .name{color:#98a2b3}
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><img src="codeshield.svg" alt=""><div class="name">CodeShield</div><div class="row"><img src="codeshield.svg"><img class="small" src="codeshield.svg"></div></div>
  <div class="card"><img src="pyshield.svg" alt=""><div class="name">PyShield</div><div class="row"><img src="pyshield.svg"><img class="small" src="pyshield.svg"></div></div>
  <div class="card"><img src="javashield.svg" alt=""><div class="name">JavaShield</div><div class="row"><img src="javashield.svg"><img class="small" src="javashield.svg"></div></div>
</div>
<div class="wrap">
  <div class="card dark"><img src="codeshield.svg" alt=""><div class="name">dark</div></div>
  <div class="card dark"><img src="pyshield.svg" alt=""><div class="name">dark</div></div>
  <div class="card dark"><img src="javashield.svg" alt=""><div class="name">dark</div></div>
</div>
</body>
</html>
